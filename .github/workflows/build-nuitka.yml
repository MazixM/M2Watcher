name: Build EXE (Nuitka, eksperymentalny)

# Build eksperymentalny obok PyInstallera (build.yml). Nuitka kompiluje kod do C — inna
# struktura pliku niż PyInstaller, zwykle mniej fałszywych alarmów antywirusów. Nie tworzy
# release'u; daje artefakt do pobrania i pomiaru na VirusTotal. Nie dotyka głównego buildu.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/build-nuitka.yml'
      - '.github/scripts/vt_scan.py'

concurrency:
  group: build-nuitka-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-nuitka:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      display_version: ${{ steps.version.outputs.display }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      vt_result: ${{ steps.vt.outputs.result }}
      vt_url: ${{ steps.vt.outputs.url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Determine version
      id: version
      shell: bash
      run: |
        version=$(python .github/scripts/next_version.py)
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          head_sha="${{ github.event.pull_request.head.sha }}"
          display="${version}-dev+${head_sha::7}"
        else
          display="${version}"
        fi
        echo "__version__ = \"${display}\"" > app/version.py
        echo "display=${display}" >> "$GITHUB_OUTPUT"
        echo "Wersja: ${display}"

    - name: Install dependencies
      working-directory: ./app
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-nuitka.txt

    - name: Run tests
      working-directory: ./app
      run: |
        python -m unittest discover -s tests -v

    - name: Build EXE (Nuitka)
      working-directory: ./app
      env:
        PYTHONIOENCODING: utf-8
      run: |
        python build_nuitka.py

    - name: Verify EXE exists
      working-directory: ./app
      run: |
        if (-not (Test-Path "dist/M2Watcher.exe")) {
          Write-Error "M2Watcher.exe (Nuitka) nie został utworzony!"
          exit 1
        }
        $size = (Get-Item "dist/M2Watcher.exe").Length / 1MB
        Write-Output "✓ M2Watcher.exe (Nuitka) utworzony (rozmiar: $([math]::Round($size, 2)) MB)"

    - name: Self-test EXE
      working-directory: ./app
      shell: pwsh
      run: |
        $p = Start-Process -FilePath "dist/M2Watcher.exe" -ArgumentList "--self-test" -Wait -PassThru
        Get-Content "$env:USERPROFILE\.m2watcher\logs\m2watcher.log" -Tail 20
        if ($p.ExitCode -ne 0) { Write-Error "Self-test exe (Nuitka) nie przeszedł (kod $($p.ExitCode))"; exit 1 }

    - name: Skan VirusTotal (informacyjnie)
      id: vt
      working-directory: ./app
      shell: bash
      env:
        VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      run: |
        if [ -z "$VT_API_KEY" ]; then
          echo "result=brak klucza VT (dodaj sekret VIRUSTOTAL_API_KEY)" >> "$GITHUB_OUTPUT"
          echo "Pominięto skan VirusTotal — brak sekretu VIRUSTOTAL_API_KEY." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        python ../.github/scripts/vt_scan.py "dist/M2Watcher.exe" || true

    - name: Upload EXE artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: M2Watcher-nuitka.exe
        path: app/dist/M2Watcher.exe
        retention-days: 30

    - name: Link do pobrania w podsumowaniu
      shell: bash
      run: |
        echo "### 📦 [Pobierz M2Watcher.exe — Nuitka (${{ steps.version.outputs.display }})](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  pr-comment:
    needs: build-nuitka
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
    - name: Dodaj/zaktualizuj komentarz z linkiem do exe (Nuitka)
      uses: actions/github-script@v7
      env:
        ARTIFACT_URL: ${{ needs.build-nuitka.outputs.artifact_url }}
        VERSION: ${{ needs.build-nuitka.outputs.display_version }}
        VT_RESULT: ${{ needs.build-nuitka.outputs.vt_result }}
        VT_URL: ${{ needs.build-nuitka.outputs.vt_url }}
      with:
        script: |
          const marker = '<!-- m2watcher-nuitka-exe -->';
          const sha = context.payload.pull_request.head.sha;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          let vtLine = '';
          if (process.env.VT_RESULT) {
            const link = process.env.VT_URL ? `[${process.env.VT_RESULT}](${process.env.VT_URL})` : process.env.VT_RESULT;
            vtLine = `\nVirusTotal: ${link}\n`;
          }
          const body = [
            marker,
            '### 🧪 M2Watcher.exe (Nuitka) do przetestowania',
            '',
            `**[Pobierz M2Watcher.exe (Nuitka)](${process.env.ARTIFACT_URL})** — wersja \`${process.env.VERSION}\`, commit ${sha.slice(0, 7)}`,
            vtLine,
            'Build eksperymentalny (kompilowany do C). Jeden plik, ważny 30 dni. [Szczegóły builda](' + runUrl + ')',
            '',
            '_Komentarz aktualizuje się po każdym pushu do tego PR-a._',
          ].join('\n');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
