name: Build EXE

# PR: testy + build exe, bez artefaktu (artefakty zużywają miesięczny limit miejsca konta).
# Push do main: to samo + artefakt, a po sukcesie automatyczny release v.X.Y.Z z gołym M2Watcher.exe.
# Asset ma zawsze tę samą nazwę (bez sha w nazwie, bez zipa): jeden stały link do pobrania
# (releases/latest/download/M2Watcher.exe), a reputacja pliku w SmartScreen/AV nie zeruje się co wydanie.
# Wersja: app/version.py; jeśli release z nią już istnieje, patch jest podbijany automatycznie.

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  pull_request:  # bez filtra ścieżek — każdy PR przechodzi testy i build exe
    branches:
      - main
      - master
  workflow_dispatch:  # Ręczne uruchomienie z dowolnej gałęzi
    inputs:
      release:
        description: 'Utwórz release (na main tworzy się sam po każdym pushu)'
        required: false
        type: boolean
        default: false

# Buildy na tej samej gałęzi idą po kolei — dwa szybkie pushe nie wezmą tego samego numeru wersji
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write  # usuwanie starszych artefaktów
    outputs:
      version: ${{ steps.version.outputs.version }}
      display_version: ${{ steps.version.outputs.display }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      vt_result: ${{ steps.vt.outputs.result }}
      vt_url: ${{ steps.vt.outputs.url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # tagi są potrzebne do wyliczenia wersji

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Determine version
      id: version
      shell: bash
      run: |
        version=$(python .github/scripts/next_version.py)
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          head_sha="${{ github.event.pull_request.head.sha }}"  # commit z PR-a, nie tymczasowy merge commit
          display="${version}-dev+${head_sha::7}"
        else
          display="${version}"
        fi
        echo "__version__ = \"${display}\"" > app/version.py
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "display=${display}" >> "$GITHUB_OUTPUT"
        echo "Wersja: ${display}"

    - name: Install dependencies
      working-directory: ./app
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt

    - name: Bootloader PyInstallera ze źródeł (mniej fałszywych alarmów)
      shell: bash
      run: |
        # Gotowy bootloader z wheela ma bajty wspólne z tysiącami próbek malware, na których uczą
        # się modele AV (Wacatac!ml, „Static AI”). Skompilowany tu ze źródeł ma inny odcisk.
        # Windows-latest ma MSVC. Gdyby build się nie udał — wracamy do bootloadera z wheela.
        ver=$(python -c "import PyInstaller,sys; sys.stdout.write(PyInstaller.__version__)")
        echo "PyInstaller $ver — buduję bootloader ze źródeł"
        if pip install --no-binary pyinstaller --force-reinstall --no-deps "pyinstaller==$ver"; then
          echo "✓ bootloader zbudowany ze źródeł"
        else
          echo "::warning::Nie udało się zbudować bootloadera ze źródeł — używam gotowego z wheela"
          pip install --force-reinstall --no-deps "pyinstaller==$ver"
        fi

    - name: Run tests
      working-directory: ./app
      run: |
        python -m unittest discover -s tests -v

    - name: Smoke test (imports on Windows)
      working-directory: ./app
      run: |
        python -c "import main, gui.main_window, gui.settings, m2watcher, sounds; assert m2watcher.WIN32_AVAILABLE, 'pywin32'; assert sounds.IS_WINDOWS; print('OK')"

    - name: Build EXE
      working-directory: ./app
      env:
        PYTHONIOENCODING: utf-8
      run: |
        python build_exe.py

    - name: Verify EXE exists
      working-directory: ./app
      run: |
        if (-not (Test-Path "dist/M2Watcher.exe")) {
          Write-Error "M2Watcher.exe nie został utworzony!"
          exit 1
        }
        $size = (Get-Item "dist/M2Watcher.exe").Length / 1MB
        Write-Output "✓ M2Watcher.exe utworzony (rozmiar: $([math]::Round($size, 2)) MB)"

    - name: Self-test EXE (moduły spakowane w exe)
      working-directory: ./app
      shell: pwsh
      run: |
        # Test na gotowym exe, nie na Pythonie — łapie moduły pominięte przez PyInstallera
        $p = Start-Process -FilePath "dist/M2Watcher.exe" -ArgumentList "--self-test" -Wait -PassThru
        Get-Content "$env:USERPROFILE\.m2watcher\logs\m2watcher.log" -Tail 20
        if ($p.ExitCode -ne 0) { Write-Error "Self-test exe nie przeszedł (kod $($p.ExitCode))"; exit 1 }

    - name: Skan VirusTotal (informacyjnie)
      id: vt
      working-directory: ./app
      shell: bash
      env:
        PYTHONIOENCODING: utf-8
        VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      run: |
        # Sprawdza, ile silników oznacza świeży exe. Nie blokuje builda — sam pomiar.
        # Wymaga sekretu VIRUSTOTAL_API_KEY (darmowe konto VirusTotal). Bez niego krok się pomija.
        if [ -z "$VT_API_KEY" ]; then
          echo "result=brak klucza VT (dodaj sekret VIRUSTOTAL_API_KEY)" >> "$GITHUB_OUTPUT"
          echo "Pominięto skan VirusTotal — brak sekretu VIRUSTOTAL_API_KEY." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        python ../.github/scripts/vt_scan.py "dist/M2Watcher.exe" || true

    - name: Upload EXE artifact
      id: upload
      # Tylko to, z czego job release robi wydanie; PR-y nie zużywają limitu miejsca na artefakty.
      if: >-
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
        (github.event_name == 'workflow_dispatch' && inputs.release)
      uses: actions/upload-artifact@v4
      with:
        name: M2Watcher.exe
        path: app/dist/M2Watcher.exe
        retention-days: 7  # na main exe zostaje na stałe w GitHub Release

    - name: Usuń starsze artefakty z tej gałęzi (zostaje najnowszy)
      if: steps.upload.outcome == 'success'
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        NAME_PATTERN: '^M2Watcher\.exe$'
      with:
        script: |
          // Limit miejsca na artefakty liczy się z GB×godzin w całym miesiącu, więc trzymamy
          // tylko najnowszy build z każdej gałęzi; retention-days sprząta porzucone gałęzie.
          const { owner, repo } = context.repo;
          const re = new RegExp(process.env.NAME_PATTERN);
          const all = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
          const old = all.filter(a => !a.expired && re.test(a.name)
            && a.workflow_run?.head_branch === process.env.BRANCH
            && a.workflow_run?.id !== context.runId);
          for (const a of old) {
            await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
            core.info(`Usunięto ${a.name} (run ${a.workflow_run.id}, ${Math.round(a.size_in_bytes / 1048576)} MB)`);
          }
          core.info(`Usunięto ${old.length} starszych artefaktów z gałęzi ${process.env.BRANCH}`);

    - name: Link do pobrania w podsumowaniu
      if: steps.upload.outcome == 'success'
      shell: bash
      run: |
        echo "### 📦 [Pobierz M2Watcher.exe (${{ steps.version.outputs.display }})](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tworzenie tagu i release'u

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download EXE
      uses: actions/download-artifact@v4
      with:
        name: M2Watcher.exe
        path: dist

    - name: Verify EXE
      run: |
        # Jeden asset o stałej nazwie: M2Watcher.exe (bez zipa, bez sha w nazwie).
        test -f dist/M2Watcher.exe
        ls -la dist/M2Watcher.exe

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: v.${{ needs.build.outputs.version }}
        ASSET: dist/M2Watcher.exe
        VT_RESULT: ${{ needs.build.outputs.vt_result }}
        VT_URL: ${{ needs.build.outputs.vt_url }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "::error::Release $TAG już istnieje — podbij wersję w app/version.py"
          exit 1
        fi
        bash .github/scripts/release_notes.sh "$TAG" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "M2Watcher.exe" "$VT_RESULT" "$VT_URL" > notes.md
        cat notes.md
        gh release create "$TAG" "$ASSET" \
          --target "$GITHUB_SHA" \
          --title "Release $TAG" \
          --notes-file notes.md
        echo "### ✅ Utworzono release $TAG" >> "$GITHUB_STEP_SUMMARY"
