name: Build EXE

# PR: testy + build exe (artefakt).
# Push do main: to samo, a po sukcesie automatyczny release v.X.Y.Z z zipem.
# Wersja: app/version.py; jeśli release z nią już istnieje, patch jest podbijany automatycznie.

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  workflow_dispatch:  # Ręczne uruchomienie z dowolnej gałęzi
    inputs:
      release:
        description: 'Utwórz release (na main tworzy się sam po każdym pushu)'
        required: false
        type: boolean
        default: false

# Buildy na tej samej gałęzi idą po kolei — dwa szybkie pushe nie wezmą tego samego numeru wersji
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # tagi są potrzebne do wyliczenia wersji

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Determine version
      id: version
      shell: bash
      run: |
        version=$(python .github/scripts/next_version.py)
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          display="${version}-dev+${GITHUB_SHA::7}"
        else
          display="${version}"
        fi
        echo "__version__ = \"${display}\"" > app/version.py
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "Wersja: ${display}"

    - name: Install dependencies
      working-directory: ./app
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt

    - name: Run tests
      working-directory: ./app
      run: |
        python -m unittest discover -s tests -v

    - name: Smoke test (imports on Windows)
      working-directory: ./app
      run: |
        python -c "import main, gui.main_window, gui.settings, m2watcher, sounds; assert m2watcher.WIN32_AVAILABLE, 'pywin32'; assert sounds.IS_WINDOWS; print('OK')"

    - name: Build EXE
      working-directory: ./app
      env:
        PYTHONIOENCODING: utf-8
      run: |
        python build_exe.py

    - name: Verify EXE exists
      working-directory: ./app
      run: |
        if (-not (Test-Path "dist/M2Watcher.exe")) {
          Write-Error "M2Watcher.exe nie został utworzony!"
          exit 1
        }
        $size = (Get-Item "dist/M2Watcher.exe").Length / 1MB
        Write-Output "✓ M2Watcher.exe utworzony (rozmiar: $([math]::Round($size, 2)) MB)"

    - name: Self-test EXE (moduły spakowane w exe)
      working-directory: ./app
      shell: pwsh
      run: |
        # Test na gotowym exe, nie na Pythonie — łapie moduły pominięte przez PyInstallera
        $p = Start-Process -FilePath "dist/M2Watcher.exe" -ArgumentList "--self-test" -Wait -PassThru
        Get-Content "$env:USERPROFILE\.m2watcher\logs\m2watcher.log" -Tail 20
        if ($p.ExitCode -ne 0) { Write-Error "Self-test exe nie przeszedł (kod $($p.ExitCode))"; exit 1 }

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: M2Watcher.exe
        path: app/dist/M2Watcher.exe
        retention-days: 30

  release:
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tworzenie tagu i release'u

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download EXE
      uses: actions/download-artifact@v4
      with:
        name: M2Watcher.exe
        path: dist

    - name: Create ZIP
      id: zip
      run: |
        zip_name="M2Watcher-${GITHUB_SHA}.zip"
        (cd dist && zip -q "../${zip_name}" M2Watcher.exe)
        echo "name=${zip_name}" >> "$GITHUB_OUTPUT"
        ls -la "${zip_name}"

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: v.${{ needs.build.outputs.version }}
        ZIP: ${{ steps.zip.outputs.name }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "::error::Release $TAG już istnieje — podbij wersję w app/version.py"
          exit 1
        fi
        bash .github/scripts/release_notes.sh "$TAG" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$ZIP" > notes.md
        cat notes.md
        gh release create "$TAG" "$ZIP" \
          --target "$GITHUB_SHA" \
          --title "Release $TAG" \
          --notes-file notes.md
        echo "### ✅ Utworzono release $TAG" >> "$GITHUB_STEP_SUMMARY"
