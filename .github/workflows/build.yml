name: Build EXE

# PR: testy + build exe (artefakt) dla KAŻDEGO PR-a + komentarz w PR z linkiem do pobrania exe.
# Push do main: to samo, a po sukcesie automatyczny release v.X.Y.Z z zipem.
# Wersja: app/version.py; jeśli release z nią już istnieje, patch jest podbijany automatycznie.

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
  pull_request:  # bez filtra ścieżek — każdy PR dostaje exe do pobrania przed scaleniem
    branches:
      - main
      - master
  workflow_dispatch:  # Ręczne uruchomienie z dowolnej gałęzi
    inputs:
      release:
        description: 'Utwórz release (na main tworzy się sam po każdym pushu)'
        required: false
        type: boolean
        default: false

# Buildy na tej samej gałęzi idą po kolei — dwa szybkie pushe nie wezmą tego samego numeru wersji
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      display_version: ${{ steps.version.outputs.display }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      vt_result: ${{ steps.vt.outputs.result }}
      vt_url: ${{ steps.vt.outputs.url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # tagi są potrzebne do wyliczenia wersji

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Determine version
      id: version
      shell: bash
      run: |
        version=$(python .github/scripts/next_version.py)
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          head_sha="${{ github.event.pull_request.head.sha }}"  # commit z PR-a, nie tymczasowy merge commit
          display="${version}-dev+${head_sha::7}"
        else
          display="${version}"
        fi
        echo "__version__ = \"${display}\"" > app/version.py
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "display=${display}" >> "$GITHUB_OUTPUT"
        echo "Wersja: ${display}"

    - name: Install dependencies
      working-directory: ./app
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-build.txt

    - name: Run tests
      working-directory: ./app
      run: |
        python -m unittest discover -s tests -v

    - name: Smoke test (imports on Windows)
      working-directory: ./app
      run: |
        python -c "import main, gui.main_window, gui.settings, m2watcher, sounds; assert m2watcher.WIN32_AVAILABLE, 'pywin32'; assert sounds.IS_WINDOWS; print('OK')"

    - name: Build EXE
      working-directory: ./app
      env:
        PYTHONIOENCODING: utf-8
      run: |
        python build_exe.py

    - name: Verify EXE exists
      working-directory: ./app
      run: |
        # Tryb --onedir: exe leży w folderze dist/M2Watcher obok folderu _internal
        if (-not (Test-Path "dist/M2Watcher/M2Watcher.exe")) {
          Write-Error "M2Watcher.exe nie został utworzony!"
          exit 1
        }
        $size = (Get-ChildItem "dist/M2Watcher" -Recurse | Measure-Object Length -Sum).Sum / 1MB
        Write-Output "✓ Folder M2Watcher utworzony (rozmiar: $([math]::Round($size, 2)) MB)"

    - name: Self-test EXE (moduły spakowane w exe)
      working-directory: ./app
      shell: pwsh
      run: |
        # Test na gotowym exe, nie na Pythonie — łapie moduły pominięte przez PyInstallera
        $p = Start-Process -FilePath "dist/M2Watcher/M2Watcher.exe" -ArgumentList "--self-test" -Wait -PassThru
        Get-Content "$env:USERPROFILE\.m2watcher\logs\m2watcher.log" -Tail 20
        if ($p.ExitCode -ne 0) { Write-Error "Self-test exe nie przeszedł (kod $($p.ExitCode))"; exit 1 }

    - name: Skan VirusTotal (informacyjnie)
      id: vt
      working-directory: ./app
      shell: bash
      env:
        VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      run: |
        # Sprawdza, ile silników oznacza świeży exe. Nie blokuje builda — sam pomiar.
        # Wymaga sekretu VIRUSTOTAL_API_KEY (darmowe konto VirusTotal). Bez niego krok się pomija.
        if [ -z "$VT_API_KEY" ]; then
          echo "result=brak klucza VT (dodaj sekret VIRUSTOTAL_API_KEY)" >> "$GITHUB_OUTPUT"
          echo "Pominięto skan VirusTotal — brak sekretu VIRUSTOTAL_API_KEY." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        python ../.github/scripts/vt_scan.py "dist/M2Watcher/M2Watcher.exe" || true

    - name: Upload artifact (folder M2Watcher)
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: M2Watcher
        path: app/dist/M2Watcher
        retention-days: 30

    - name: Link do pobrania w podsumowaniu
      shell: bash
      run: |
        echo "### 📦 [Pobierz M2Watcher (${{ steps.version.outputs.display }})](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  pr-comment:
    # Komentarz w PR z bezpośrednim linkiem do exe — aktualizowany przy każdym pushu.
    # PR-y z forków mają token tylko do odczytu, więc je pomijamy (exe i tak jest w artefaktach runu).
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
    - name: Dodaj/zaktualizuj komentarz z linkiem do exe
      uses: actions/github-script@v7
      env:
        ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
        VERSION: ${{ needs.build.outputs.display_version }}
        VT_RESULT: ${{ needs.build.outputs.vt_result }}
        VT_URL: ${{ needs.build.outputs.vt_url }}
      with:
        script: |
          const marker = '<!-- m2watcher-pr-exe -->';
          const sha = context.payload.pull_request.head.sha;
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          let vtLine = '';
          if (process.env.VT_RESULT) {
            const link = process.env.VT_URL ? `[${process.env.VT_RESULT}](${process.env.VT_URL})` : process.env.VT_RESULT;
            vtLine = `\nVirusTotal: ${link}\n`;
          }
          const body = [
            marker,
            '### 📦 M2Watcher do przetestowania',
            '',
            `**[Pobierz M2Watcher](${process.env.ARTIFACT_URL})** — wersja \`${process.env.VERSION}\`, commit ${sha.slice(0, 7)}`,
            vtLine,
            'To zip z folderem `M2Watcher` (artefakt GitHub Actions, trzeba być zalogowanym), ważny 30 dni. Rozpakuj i uruchom `M2Watcher.exe` ze środka. [Szczegóły builda](' + runUrl + ')',
            '',
            '_Komentarz aktualizuje się po każdym pushu do tego PR-a._',
          ].join('\n');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

  release:
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tworzenie tagu i release'u

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download folder M2Watcher
      uses: actions/download-artifact@v4
      with:
        name: M2Watcher
        path: dist/M2Watcher

    - name: Create ZIP
      id: zip
      run: |
        # Zip z folderem M2Watcher w środku (exe + _internal) — tryb --onedir
        zip_name="M2Watcher-${GITHUB_SHA}.zip"
        (cd dist && zip -r -q "../${zip_name}" M2Watcher)
        echo "name=${zip_name}" >> "$GITHUB_OUTPUT"
        ls -la "${zip_name}"

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: v.${{ needs.build.outputs.version }}
        ZIP: ${{ steps.zip.outputs.name }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "::error::Release $TAG już istnieje — podbij wersję w app/version.py"
          exit 1
        fi
        bash .github/scripts/release_notes.sh "$TAG" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$ZIP" > notes.md
        cat notes.md
        gh release create "$TAG" "$ZIP" \
          --target "$GITHUB_SHA" \
          --title "Release $TAG" \
          --notes-file notes.md
        echo "### ✅ Utworzono release $TAG" >> "$GITHUB_STEP_SUMMARY"
